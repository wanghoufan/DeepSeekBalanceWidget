schema_version: 2.3.1
authoritative: true
source_of_truth: docs/model/MODEL_ROUTING_REGISTRY.yaml
go_policy:
  scheme: B
  default: DENY_NON_TASK_MANAGER
  task_manager_pool: OPENCODE_GO
  override:
    required:
    - trusted_user_approval_receipt
    - specific_task_id
    - specific_dispatch_id
    - one_shot
    auto_revert: DENY_AFTER_USE
    task_manager_may_issue_receipt: false
resource_pools:
  OPENCODE_GO:
    purpose: CONTROL_PLANE_RESERVE
    default_roles:
    - task-manager
    external_maintenance_allowed: false
  OPENCODE_FREE:
    purpose: LOW_COST_EXECUTION
    policy: FREE_FIRST_WHEN_CAPABILITY_AND_QUALIFICATION_ARE_SUFFICIENT
  GPT_PRO:
    purpose: PROFESSIONAL_EXECUTION
    accounts: 2
    policy: USE_APPROVED_PRODUCTION_MODELS_WITHOUT_CONSUMING_CONTROL_PLANE_GO
role_pool_policy:
  task-manager:
    allowed_pools:
    - OPENCODE_GO
    required_capabilities:
    - vision
    - long_context
    - tool_calling
    - orchestration
  planner:
    allowed_pools:
    - OPENCODE_FREE
    - GPT_PRO
  builder:
    allowed_pools:
    - OPENCODE_FREE
    - GPT_PRO
  code-reviewer:
    allowed_pools:
    - OPENCODE_FREE
    - GPT_PRO
  qa:
    allowed_pools:
    - OPENCODE_FREE
    - GPT_PRO
  product-reviewer:
    allowed_pools:
    - OPENCODE_FREE
    - GPT_PRO
  experience-recorder:
    allowed_pools:
    - OPENCODE_FREE
    - GPT_PRO
  neat-freak:
    allowed_pools:
    - OPENCODE_FREE
    - GPT_PRO
current_production_mappings:
  task-manager:
    model_ref: opencode-go/mimo-v2.5
    note: Current mapping from governance baseline; runtime launch still requires
      VERIFIED launch contract.
  senior-expert:
    model_ref: codex/gpt-5.6-sol
    role: backend_not_ninth_role
    note: High-difficulty coding/root-cause/second-opinion backend.
