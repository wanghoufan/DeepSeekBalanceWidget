name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and test
        shell: pwsh
        run: |
          dotnet restore DeepSeekBalanceWidget.sln
          dotnet build DeepSeekBalanceWidget.sln -c Release --no-restore
          dotnet test DeepSeekBalanceWidget.sln -c Release --no-build

      - name: Publish Windows x64
        shell: pwsh
        run: .\scripts\publish.ps1 -Runtime win-x64

      - name: Package Windows
        shell: pwsh
        run: |
          $archive = "DeepSeekBalanceWidget-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -LiteralPath ".\release\DeepSeekBalanceWidget.exe" -DestinationPath $archive -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: DeepSeekBalanceWidget-*-win-x64.zip

  publish-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build macOS application
        run: |
          dotnet restore src/DeepSeekBalanceWidget.Mac/DeepSeekBalanceWidget.Mac.csproj
          dotnet build src/DeepSeekBalanceWidget.Mac/DeepSeekBalanceWidget.Mac.csproj -c Release --no-restore

      - name: Publish macOS arm64
        run: bash scripts/publish-macos.sh arm64

      - name: Publish macOS x64
        run: bash scripts/publish-macos.sh x64

      - name: Package macOS
        run: |
          ditto -c -k --keepParent release/macos-arm64/DeepSeekBalanceWidget.app "DeepSeekBalanceWidget-$GITHUB_REF_NAME-macos-arm64.zip"
          ditto -c -k --keepParent release/macos-x64/DeepSeekBalanceWidget.app "DeepSeekBalanceWidget-$GITHUB_REF_NAME-macos-x64.zip"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: DeepSeekBalanceWidget-*-macos-*.zip

  release:
    needs: [publish-windows, publish-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*/*.zip \
            --title "DeepSeek Balance Widget $GITHUB_REF_NAME" \
            --generate-notes