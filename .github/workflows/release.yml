name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and test
        shell: pwsh
        run: |
          dotnet restore DeepSeekBalanceWidget.sln
          dotnet build DeepSeekBalanceWidget.sln -c Release --no-restore
          dotnet test DeepSeekBalanceWidget.sln -c Release --no-build

      - name: Publish Windows x64
        shell: pwsh
        run: .\scripts\publish.ps1 -Runtime win-x64

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $archive = "DeepSeekBalanceWidget-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -LiteralPath ".\release\DeepSeekBalanceWidget.exe" -DestinationPath $archive -Force
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" `
            --title "DeepSeek Balance Widget $env:GITHUB_REF_NAME" `
            --generate-notes
